<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Devices')}"></head>

<body>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="page-title">Devices</h1>
                    <p class="page-subtitle">Manage all your smart home devices</p>
                </div>
                <form th:action="@{/devices/import}" method="post">
                    <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->
                    <button class="btn btn-primary" type="submit">
                        <i class="fas fa-cloud-download-alt"></i> Import External Device
                    </button>
                </form>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
                <!-- Add Device Form -->
                <div class="card" style="height: fit-content;">
                    <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-plus-circle text-primary"></i> Add New Device
                    </h3>
                    <form th:action="@{/devices}" th:object="${deviceRequest}" method="post"
                          style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-weight: 500; font-size: 0.875rem;">Name</label>
                            <input th:field="*{name}" required
                                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                                   placeholder="e.g., Living Room Light">
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                                <label style="font-weight: 500; font-size: 0.875rem;">Type</label>
                                <select th:field="*{type}" required
                                        style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);">
                                    <option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option>
                                </select>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                                <label style="font-weight: 500; font-size: 0.875rem;">Tier</label>
                                <select th:field="*{tier}" required
                                        style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);">
                                    <option th:each="tier : ${tiers}" th:value="${tier}" th:text="${tier}"></option>
                                </select>
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-weight: 500; font-size: 0.875rem;">Room</label>
                            <select th:field="*{roomId}" required
                                    style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);">
                                <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name}"></option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                                <label style="font-weight: 500; font-size: 0.875rem;">Mode (Optional)</label>
                                <input th:field="*{mode}" placeholder="Eco, Auto..."
                                       style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);">
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                                <label style="font-weight: 500; font-size: 0.875rem;">Location</label>
                                <input th:field="*{location}" placeholder="e.g., North wall"
                                       style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.75rem;">Add
                            Device
                        </button>
                    </form>
                </div>
                <!-- Devices Grid -->
                <div class="grid-2">
                    <div th:each="device : ${devices}" class="card device-card"
                         th:classappend="${device.status.name() == 'ON' ? 'active' : ''}">
                        <div class="device-header">
                            <div class="device-icon">
                                <i th:if="${device.type.name() == 'LIGHT'}" class="fas fa-lightbulb"></i>
                                <i th:if="${device.type.name() == 'THERMOSTAT'}" class="fas fa-temperature-half"></i>
                                <i th:if="${device.type.name() == 'CAMERA'}" class="fas fa-video"></i>
                                <i th:if="${device.type.name() == 'SMART_DOOR'}" class="fas fa-door-closed"></i>
                                <i th:if="${device.type.name() != 'LIGHT' and device.type.name() != 'THERMOSTAT' and device.type.name() != 'CAMERA' and device.type.name() != 'SMART_DOOR'}"
                                   class="fas fa-microchip"></i>
                            </div>
                            <!-- Switch -->
                            <form th:action="@{/devices/{id}/{action}(id=${device.id}, action=${device.status.name() == 'ON' ? 'off' : 'on'})}"
                                  method="post">
                                <button type="submit" style="background: none; border: none; cursor: pointer;">
                                    <label class="switch" style="pointer-events: none;">
                                        <input type="checkbox" th:checked="${device.status.name() == 'ON'}">
                                        <span class="slider"></span>
                                    </label>
                                </button>
                            </form>
                        </div>
                        <div class="device-info">
                            <h3 th:text="${device.name}">Device Name</h3>
                            <p th:text="${device.room.name} + ' | ' + ${device.tier}">Room | Tier</p>

                            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                <span style="font-size: 0.75rem; padding: 0.25rem 0.5rem; background: var(--bg-color); border-radius: 12px; border: 1px solid var(--border-color);"
                                      th:text="${device.status}">OFF</span>
                                <span th:if="${device.mode != null and !device.mode.isEmpty()}"
                                      style="font-size: 0.75rem; padding: 0.25rem 0.5rem; background: rgba(59, 130, 246, 0.1); color: var(--info); border-radius: 12px;"
                                      th:text="${device.mode}">Eco</span>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                            <!-- Change Mode Form -->
                            <form th:action="@{/devices/{id}/mode(id=${device.id})}" method="post"
                                  style="display: flex; gap: 0.5rem;">
                                <input name="mode" placeholder="Mode" required
                                       style="width: 80px; padding: 0.25rem 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-main); font-size: 0.75rem;">
                                <button type="submit" class="btn"
                                        style="padding: 0.25rem 0.5rem; background: var(--bg-color); border: 1px solid var(--border-color);">
                                    <i class="fas fa-check"></i></button>
                            </form>
                            <!-- Actions -->
                            <div style="display: flex; gap: 0.5rem;">
                                <form th:action="@{/devices/{id}/clone(id=${device.id})}" method="post">
                                    <button type="submit" class="btn text-info"
                                            style="padding: 0.25rem; background: none;" title="Clone Configuration"><i
                                            class="fas fa-copy"></i></button>
                                </form>
                                <form th:action="@{/devices/{id}/delete(id=${device.id})}" method="post">
                                    <button type="submit" class="btn text-danger"
                                            style="padding: 0.25rem; background: none;" title="Delete Device"><i
                                            class="fas fa-trash"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
