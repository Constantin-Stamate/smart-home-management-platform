<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Home</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-color) 0%, #cfd9df 100%);
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #1a202c 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }

        .auth-logo {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
<div class="card auth-card">
    <div class="auth-logo"><i class="fas fa-home"></i></div>
    <h2 style="margin-bottom: 0.5rem;">Create Account</h2>
    <p class="text-muted" style="margin-bottom: 2rem;">Join your Smart Home system</p>
    <div th:if="${error}"
         style="background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 0.75rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.875rem;"
         th:text="${error}">
        Error message
    </div>
    <form th:action="@{/register}" th:object="${registerRequest}" method="post"
          style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label style="font-weight: 500; font-size: 0.875rem;">Full Name</label>
            <input th:field="*{fullName}" required
                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                   placeholder="John Doe">
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label style="font-weight: 500; font-size: 0.875rem;">Email Address</label>
            <input th:field="*{email}" type="email" required
                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                   placeholder="name@example.com">
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label style="font-weight: 500; font-size: 0.875rem;">Password</label>
            <input th:field="*{password}" type="password" required minlength="6"
                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                   placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary"
                style="margin-top: 1rem; padding: 0.75rem; width: 100%; background: var(--secondary);">Sign Up
        </button>
    </form>
    <p style="margin-top: 2rem; font-size: 0.875rem;" class="text-muted">
        Already have an account? <a th:href="@{/login}" style="color: var(--secondary); font-weight: 500;">Sign in</a>
    </p>
</div>
</body>

</html>
