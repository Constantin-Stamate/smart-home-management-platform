<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rooms')}"></head>

<body>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <div class="content-area">
            <div class="page-header">
                <h1 class="page-title">Rooms</h1>
                <p class="page-subtitle">Manage rooms in your smart home</p>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
                <!-- Add Room Form -->
                <div class="card" style="height: fit-content;">
                    <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-plus-circle text-primary"></i> Add New Room</h3>
                    <form th:action="@{/rooms}" th:object="${roomRequest}" method="post"
                          style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-weight: 500; font-size: 0.875rem;">Name</label>
                            <input th:field="*{name}" required
                                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                                   placeholder="e.g., Living Room">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-weight: 500; font-size: 0.875rem;">Floor</label>
                            <input th:field="*{floor}"
                                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                                   placeholder="e.g., Ground Floor">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-weight: 500; font-size: 0.875rem;">Description</label>
                            <input th:field="*{description}"
                                   style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main);"
                                   placeholder="Optional description">
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.75rem;">Add
                            Room
                        </button>
                    </form>
                </div>
                <!-- Rooms Grid -->
                <div class="grid-2">
                    <div th:each="room : ${rooms}" class="card"
                         style="display: flex; flex-direction: column; justify-content: space-between; border-left: 4px solid var(--primary);">
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                                <div>
                                    <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;" th:text="${room.name}">Room
                                        Name</h3>
                                    <p class="text-muted" style="font-size: 0.875rem;"><i
                                            class="fas fa-layer-group"></i> <span th:text="${room.floor}">Floor</span>
                                    </p>
                                </div>
                                <i class="fas fa-door-open text-muted" style="font-size: 1.5rem;"></i>
                            </div>
                            <p style="font-size: 0.875rem; margin-bottom: 1.5rem;" th:text="${room.description}">
                                Description</p>
                            <div style="background: var(--bg-color); padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; display: flex; justify-content: space-between;">
                                <span>Devices</span>
                                <strong class="text-primary"
                                        th:text="${room.devices != null ? room.devices.size() : 0}">0</strong>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                            <form th:action="@{/rooms/{id}/delete(id=${room.id})}" method="post">
                                <button type="submit" class="btn text-danger"
                                        style="background: none; padding: 0.25rem;"><i class="fas fa-trash"></i> Delete
                                    Room
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
